name: Columbia CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGERS
# • Every push to main  → full pipeline (test + build .exe)
# • Pull request        → lint + test only (no .exe build, keeps PRs fast)
# • Manual button       → full pipeline on demand (you or your friend)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1 — LINT
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (backend)
        run: ruff check backend --select E9,F811,F821,F841
        working-directory: Columbia

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2 — BUILD + TEST + BUNDLE
  # ───────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build, Test and Bundle
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Columbia/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Columbia/frontend

      - name: Build frontend (Vite)
        run: npm run build
        working-directory: Columbia/frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Columbia/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: Columbia/backend

      - name: Install Playwright browsers (Chromium only)
        run: python -m playwright install chromium --with-deps
        working-directory: Columbia/backend

      - name: Install pytest
        run: pip install pytest pytest-asyncio httpx

      - name: Run functional tests
        run: pytest tests/ -v --tb=short
        working-directory: Columbia/backend
        env:
          COLUMBIA_CI: "1"

      - name: Bundle with PyInstaller
        if: github.event_name != 'pull_request'
        run: python -m PyInstaller --noconfirm launcher.spec
        working-directory: Columbia/backend

      - name: Verify .exe was created
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (Test-Path "dist\columbia\columbia.exe") {
            Write-Host "columbia.exe built successfully"
            Get-Item "dist\columbia\columbia.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "columbia.exe not found!"
            exit 1
          }
        working-directory: Columbia/backend

      - name: Zip the bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path "dist\columbia\*" -DestinationPath "columbia-app.zip"
        working-directory: Columbia/backend

      - name: Upload columbia.exe artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: columbia-app-${{ github.run_number }}
          path: Columbia/backend/columbia-app.zip
          retention-days: 30
          if-no-files-found: error
